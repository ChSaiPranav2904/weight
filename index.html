<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai Pranav | Health & Routine Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="glass-header" data-tilt data-tilt-max="2" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.1">
        <div class="user-info">
            <h1>Welcome, <span class="highlight">Sai Pranav</span></h1>
            <p id="current-date" class="date-display"></p>
            
            <!-- NEW: Rank & XP System UI -->
            <div class="rank-container">
                <div class="rank-badge" id="rank-badge">Bronze</div>
                <div class="xp-wrapper">
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill" id="xp-bar"></div>
                    </div>
                    <p class="xp-text"><span id="current-xp">0</span> / <span id="next-rank-xp">500</span> XP to Next Rank</p>
                </div>
            </div>
        </div>
        
        <div class="daily-progress-container">
            <div class="progress-ring" id="main-progress-ring">
                <span id="main-progress-text">0%</span>
            </div>
            <p>Daily Completion</p>
        </div>
    </header>

    <main class="dashboard-grid">
        <!-- Added data-tilt attributes to all cards for the 3D Cinematic effect -->
        <section class="glass-card metrics-card" data-tilt data-tilt-max="3" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.1">
            <div class="metric">
                <i class="fa-solid fa-weight-scale accent-blue"></i>
                <div>
                    <h4>Weight</h4>
                    <p><span id="val-weight">116</span> kg / <span id="val-goal-weight">90</span> kg</p>
                </div>
            </div>
            <div class="metric">
                <i class="fa-solid fa-calculator accent-green"></i>
                <div>
                    <h4>BMI</h4>
                    <p id="val-bmi">40.1</p>
                </div>
            </div>
        </section>

        <section class="glass-card water-card" data-tilt data-tilt-max="2" data-tilt-glare data-tilt-max-glare="0.1">
            <h3><i class="fa-solid fa-droplet accent-blue"></i> Water Tracker (+10 XP)</h3>
            <div class="water-ui">
                <div class="progress-ring" id="water-ring">
                    <span id="water-text">0L</span>
                </div>
                <div class="water-buttons">
                    <button onclick="addWater(0.25)">+250ml</button>
                    <button onclick="addWater(0.50)">+500ml</button>
                    <button onclick="addWater(1.0)">+1L</button>
                    <button onclick="resetWater()" class="btn-outline">Reset</button>
                </div>
            </div>
        </section>

        <section class="glass-card routine-card" data-tilt data-tilt-max="1" data-tilt-glare data-tilt-max-glare="0.05">
            <h3><i class="fa-solid fa-list-check accent-green"></i> Daily Routine (+15 XP)</h3>
            <div class="routine-grid" id="routine-container"></div>
        </section>

        <section class="glass-card diet-card" data-tilt data-tilt-max="1" data-tilt-glare data-tilt-max-glare="0.05">
            <h3><i class="fa-solid fa-leaf accent-green"></i> Diet Planner (+20 XP)</h3>
            <div class="table-container">
                <table id="diet-table">
                    <thead>
                        <tr>
                            <th>Meal</th>
                            <th>Food</th>
                            <th>Cals</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="glass-card gym-card" data-tilt data-tilt-max="1" data-tilt-glare data-tilt-max-glare="0.05">
            <h3><i class="fa-solid fa-dumbbell accent-orange"></i> Habits & Gym (+25 XP)</h3>
            <div class="habits-list" id="habits-container"></div>
        </section>

        <section class="glass-card chart-card" data-tilt data-tilt-max="1">
            <h3><i class="fa-solid fa-chart-line accent-purple"></i> Weight Progress</h3>
            <div class="chart-container"><canvas id="weightChart"></canvas></div>
            <div class="weight-input-group">
                <input type="number" id="new-weight" step="0.1" placeholder="Today's Weight (kg)">
                <button onclick="logWeight()">Log Weight</button>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Vanilla Tilt for Cinematic UI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
